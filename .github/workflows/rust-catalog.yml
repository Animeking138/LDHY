name: Rust catalog validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Run Clippy
        run: cargo clippy --manifest-path tools/catalog-validator/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path tools/catalog-validator/Cargo.toml

      - name: Validate LDHY data and page synchronization
        run: cargo run --manifest-path tools/catalog-validator/Cargo.toml -- --check
