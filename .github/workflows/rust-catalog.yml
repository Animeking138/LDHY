name: Rust catalog validation

on:
  push:
    branches: [main, rust-catalog-tool]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path tools/catalog-validator/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path tools/catalog-validator/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path tools/catalog-validator/Cargo.toml

      - name: Validate LDHY data and page synchronization
        run: cargo run --manifest-path tools/catalog-validator/Cargo.toml -- --check
