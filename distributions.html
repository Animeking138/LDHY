<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self';">

<body>
<div class="topbar"><a href="index.html">← Back to Linux history</a></div>
<div class="container">
  <h1>Linux Distributions Archive</h1>
  <p class="subtitle">Browse the shared catalog. Search distribution details or sort by release year and difficulty.</p>
  <div class="sort-controls">
    <button class="sortbtn active" data-sort="date" aria-pressed="true">By release date</button>
    <button class="sortbtn" data-sort="diff" aria-pressed="false">By difficulty</button>
  </div>
  <input class="search" id="search" placeholder="Search all distribution details..." aria-label="Search distributions">
  <div id="content"></div>
</div>
<script src="assets/js/distributions.js" defer></script>
