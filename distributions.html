  :root { --bg:#000000; --surface:#0b0b0b; --border:#242424; --text:#e8eef5; --muted:#7d8a99; --accent:#6ea8fe; --gold:#f0b429; --radius:12px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
  body::before { content:''; position:fixed; inset:0; z-index:-1; background:#000000; }
  .topbar { padding:1rem 1.5rem; border-bottom:1px solid var(--border); }
  .topbar a { color:var(--accent); text-decoration:none; font-weight:500; }
  .container { max-width:1000px; margin:0 auto; padding:2.5rem 1.5rem 4rem; }
  h1 { font-size:clamp(1.8rem,5vw,2.6rem); font-weight:800; margin-bottom:.5rem; }
  .subtitle { color:var(--muted); font-size:1.1rem; margin-bottom:2rem; }
  .search { width:100%; padding:.75rem 1rem; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:1rem; margin-bottom:2rem; }

  h2 { color:var(--accent); margin:2rem 0 1rem; font-size:1.3rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1rem; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1.25rem; transition:transform .2s,border-color .2s; cursor:pointer; }
  .card:hover { transform:translateY(-2px); border-color:var(--accent); }
  .card .name { font-weight:700; font-size:1.05rem; margin-bottom:.25rem; }
  .card .meta { color:var(--muted); font-size:.85rem; }
  .card .base { color:var(--gold); font-size:.8rem; margin-top:.5rem; display:inline-block; }
  .count { color:var(--muted); font-size:.9rem; margin-bottom:1rem; }

  let list = distros.map(d=>({...d, y: years[d.n]||9999, diff: DIFF[d.n]||"Intermediate"})).filter(d=>!ql||d.n.toLowerCase().includes(ql)||d.b.toLowerCase().includes(ql)||d.u.toLowerCase().includes(ql));
