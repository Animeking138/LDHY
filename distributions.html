<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()">
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=3">
<link rel="shortcut icon" href="./favicon.svg?v=3">
<title>Linux Distributions Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/distributions.css">
</head>
<body>
<div class="topbar"><a href="index.html">← Back to Linux history</a></div>
<div class="container">
  <h1>Linux Distributions Archive</h1>
  <p class="subtitle">Browse the shared catalog. Search distribution details or sort by release year and difficulty.</p>
  <div class="sort-controls">
    <button class="sortbtn active" data-sort="newest" aria-pressed="true">Newest first</button>
    <button class="sortbtn" data-sort="oldest" aria-pressed="false">Oldest first</button>
    <button class="sortbtn" data-sort="diff" aria-pressed="false">By difficulty</button>
    <button class="sortbtn" data-sort="name" aria-pressed="false">A–Z</button>
  </div>
  <input class="search" id="search" placeholder="Search all distribution details..." aria-label="Search distributions">
  <div class="filters">
    <label for="family-filter">Family</label>
    <select id="family-filter" class="filter-select"><option value="">All families</option></select>
    <label for="difficulty-filter">Difficulty</label>
    <select id="difficulty-filter" class="filter-select"><option value="">All difficulties</option></select>
  </div>
  <div class="compare-bar" id="compare-bar" hidden role="region" aria-label="Distribution comparison">
    <div class="compare-summary"><strong id="compare-count">0 selected</strong><span>Select up to three distributions to compare.</span></div>
    <div class="compare-actions">
      <button class="compare-clear" id="compare-clear" type="button">Clear</button>
      <button class="compare-open" id="compare-open" type="button" disabled>Compare selected</button>
    </div>
  </div>
  <div id="content"></div>
</div>
<script src="assets/js/distributions.js" defer></script>
</body>
</html>
