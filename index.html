<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()">
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=3">
<link rel="shortcut icon" href="./favicon.svg?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>LDHY — Linux Distros Heck Yeah</title>
<link rel="stylesheet" href="assets/css/index.css">
</head>
<body>
<header>
<svg width="80" height="80" viewBox="0 0 100 100" class="hero-logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#444"/>
    </linearGradient>
  </defs>
  <rect x="10" y="15" width="80" height="70" rx="8" fill="url(#g)" stroke="#222" stroke-width="2"/>
  <rect x="10" y="15" width="80" height="20" rx="8" fill="#222"/>
  <circle cx="20" cy="25" r="3" fill="#ff5f56"/>
  <circle cx="30" cy="25" r="3" fill="#ffbd2e"/>
  <circle cx="40" cy="25" r="3" fill="#27c93f"/>
  <text x="50" y="65" font-family="monospace" font-weight="bold" font-size="22" fill="#0f0" text-anchor="middle">LDHY</text>
</svg>
<h1 aria-label="LDHY"><span id="typed-title" aria-hidden="true">LDHY</span><span class="cursor" aria-hidden="true"></span></h1>
<p class="sub">Linux Distros Heck Yeah</p>
<nav class="home-actions" aria-label="Explore LDHY">
  <a class="home-action home-action-primary" href="compare.html">Compare distributions</a>
  <a class="home-action" href="distributions.html">Browse full archive</a>
</nav>
</header>

<div class="toolbar">
  <div class="toolbar-inner">
    <div class="search-box"><span class="search-icon" aria-hidden="true">⌕</span><input type="search" id="search" aria-label="Search distributions" placeholder="Search all distribution details..." autocomplete="off" spellcheck="false"></div>
    <div class="filter-controls">
      <label class="filter-control"><span class="label">Family</span><select id="family-filter" class="filter-select"><option value="">All families</option></select></label>
      <label class="filter-control"><span class="label">Difficulty</span><select id="difficulty-filter" class="filter-select"><option value="">All difficulties</option></select></label>
    </div>
    <div class="catalog-sort" role="group" aria-label="Sort distributions">
      <button class="sortbtn active" data-sort="newest" aria-pressed="true">Newest</button>
      <button class="sortbtn" data-sort="oldest" aria-pressed="false">Oldest</button>
      <button class="sortbtn" data-sort="diff" aria-pressed="false">Difficulty</button>
      <button class="sortbtn" data-sort="name" aria-pressed="false">A–Z</button>
    </div>
  </div>
</div>
<p class="sr-only" id="results-status" role="status" aria-live="polite" aria-atomic="true"></p>
<main id="ldhy-app">
  <section class="catalog-section" aria-labelledby="catalog-heading">
    <h2 id="catalog-heading">Explore distributions <span class="count" id="catalog-count">Loading…</span></h2>
    <div class="compare-bar" id="compare-bar" hidden role="region" aria-label="Distribution comparison">
      <div class="compare-summary"><strong id="compare-count">0 selected</strong><span>Select up to three distributions.</span></div>
      <div class="compare-actions"><button class="compare-clear" id="compare-clear" type="button">Clear</button><button class="compare-open" id="compare-open" type="button" disabled>Compare selected</button></div>
    </div>
    <div id="content" class="catalog-grid" aria-live="polite"><p class="empty">Loading the catalog…</p></div>
  </section>
  <section class="inline-comparison" id="comparison-panel" aria-labelledby="comparison-heading" hidden>
    <div class="comparison-heading"><h2 id="comparison-heading">Compare distributions</h2><button type="button" id="comparison-close" class="compare-clear">Back to catalog</button></div>
    <div id="compare-content" aria-live="polite"><p class="empty">Select two or three distributions to compare.</p></div>
  </section>
</main>
<footer><p>LDHY — Linux Distros Heck Yeah</p><div class="footer-links"><a href="https://github.com/Animeking138/LDHY" target="_blank" rel="noopener noreferrer">GitHub</a></div></footer>
<script src="assets/js/index.js" defer></script>
<script src="assets/js/catalog.js" defer></script>
</body>
</html>
