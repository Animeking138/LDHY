<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2">
<link rel="shortcut icon" href="./favicon.svg?v=2">
<title>Linux Event Detail</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000000; --surface:#0b0b0b; --border:#242424; --text:#e8eef5; --muted:#7d8a99; --accent:#6ea8fe; --gold:#f0b429; --radius:12px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }
  body::before { content:''; position:fixed; inset:0; z-index:-1; background:#000000; }
  .topbar { padding:1rem 1.5rem; border-bottom:1px solid var(--border); }
  .topbar a { color:var(--accent); text-decoration:none; font-weight:500; }
  .container { max-width:760px; margin:0 auto; padding:2.5rem 1.5rem 4rem; }
  .eyebrow { font-family:'JetBrains Mono',monospace; color:var(--gold); font-size:.85rem; margin-bottom:.5rem; }
  h1 { font-size:clamp(1.8rem,5vw,2.6rem); font-weight:800; margin-bottom:.5rem; }
  .subtitle { color:var(--muted); font-size:1.1rem; margin-bottom:2rem; }
  h2 { color:var(--accent); margin:2rem 0 .75rem; font-size:1.25rem; }
  p { margin-bottom:1rem; } ul { margin:0 0 1rem 1.25rem; color:var(--muted); } li { margin-bottom:.4rem; }
  .back { display:inline-block; margin-top:2rem; color:var(--accent); text-decoration:none; font-weight:500; }
</style>
</head>
<body>
<div class="topbar"><a href="index.html">← Back to timeline</a></div>
<div class="container" id="content"></div>
<script>
const E = {
"1969u": {t:"Unix Created", y:"1969", i:"Ken Thompson and Dennis Ritchie create Unix at Bell Labs.", b:`<h2>What happened</h2><p>Thompson and Ritchie developed Unix as a simple, elegant operating system for the PDP-7, then the PDP-11.</p><h2>Why it matters</h2><p>Unix established the design principles (files, processes, pipes, C) that Linux later inherited.</p>`},
"1973": {t:"Unix Rewritten in C", y:"1973", i:"Unix is rewritten in C, making it portable across hardware.", b:`<h2>What happened</h2><p>Ritchie rewrote Unix in C, a high-level language, enabling portability.</p><h2>Why it matters</h2><p>Portability let Unix spread to many machines and inspired Linux's cross-platform kernel.</p>`},
"1983": {t:"GNU Project", y:"1983", i:"Richard Stallman launches the GNU Project to create a free Unix-like OS.", b:`<h2>What happened</h2><p>Stallman announced GNU to provide free software replacing Unix components.</p><h2>Why it matters</h2><p>GNU tools + Linux kernel = GNU/Linux, the complete free operating system.</p>`},
"1985": {t:"FSF Founded", y:"1985", i:"The Free Software Foundation was founded in 1985; the first GNU GPL version followed in 1989.", b:`<h2>What happened</h2><p>The FSF was founded in 1985 to support the GNU Project and the free-software movement. GPL version 1 was published in 1989, not 1985. <a href="https://www.gnu.org/gnu/the-gnu-project.en.html" target="_blank" rel="noopener noreferrer">GNU Project history</a>.</p><h2>Why it matters</h2><p>The GPL became Linux's license, shaping open-source development.</p>`},
"1991": {t:"Linux 0.01", y:"1991", i:"Torvalds announced the project in August; the first 0.01 code appeared in September 1991.", b:`<h2>What happened</h2><p>Torvalds announced his hobby project on 25 August 1991. Linux 0.01 code appeared on 17 September; the widely circulated public release announcement followed with version 0.02 in October. <a href="https://www.usenix.org/system/files/login/issues/login_summer16_issue.pdf" target="_blank" rel="noopener noreferrer">USENIX historical account</a>.</p><h2>Why it matters</h2><p>This was the birth of Linux, soon combined with GNU to form a full OS.</p>`},
"1992": {t:"GPL License", y:"1992", i:"Linux relicensed under the GNU GPL, enabling free distribution.", b:`<h2>What happened</h2><p>Torvalds adopted the GPL, aligning Linux with the free software movement.</p><h2>Why it matters</h2><p>Enabled massive collaborative development and distribution.</p>`},
"1993": {t:"Slackware & Debian", y:"1993", i:"Early Linux distributions Slackware and Debian are founded.", b:`<h2>What happened</h2><p>Slackware (Patrick Volkerding) and Debian (Ian Murdock) launched.</p><h2>Why it matters</h2><p>Distributions made Linux installable and usable by ordinary users.</p>`},
"1994": {t:"Linux 1.0", y:"1994", i:"First stable Linux kernel (1.0) released.", b:`<h2>What happened</h2><p>Linux 1.0 marked the kernel as production-ready.</p><h2>Why it matters</h2><p>Signaled Linux's readiness for real-world use.</p>`},
"1996": {t:"Tux Mascot", y:"1996", i:"Tux the penguin becomes the official Linux mascot.", b:`<h2>What happened</h2><p>Larry Ewing created Tux; the community adopted it as mascot.</p><h2>Why it matters</h2><p>Tux became the beloved symbol of Linux.</p>`},
"1998": {t:"Major Vendor Support", y:"1998", i:"IBM, Oracle, and others announce Linux support.", b:`<h2>What happened</h2><p>Major vendors committed to Linux, validating it for enterprise.</p><h2>Why it matters</h2><p>Accelerated enterprise adoption.</p>`},
"2003": {t:"SCO Lawsuit", y:"2003", i:"SCO Group files litigation against IBM over alleged misuse of Unix-related intellectual property.", b:`<h2>What happened</h2><p>SCO filed suit against IBM in 2003. The prolonged dispute involved multiple claims and rulings; it is misleading to summarize the entire case as a single court rejection.</p><h2>Why it matters</h2><p>Removed legal uncertainty around Linux.</p>`},
"2004": {t:"Ubuntu Launches", y:"2004", i:"Canonical releases Ubuntu, popularizing desktop Linux.", b:`<h2>What happened</h2><p>Mark Shuttleworth's Canonical released Ubuntu based on Debian.</p><h2>Why it matters</h2><p>Made Linux accessible to desktop users.</p>`},
"2007": {t:"Android Uses Linux", y:"2007", i:"Android is announced in 2007; its first commercial handset follows in 2008.", b:`<h2>What happened</h2><p>Android was announced in 2007 and its first commercial handset arrived in 2008. Android uses the Linux kernel, but its platform and user space differ from a conventional GNU/Linux desktop distribution.</p><h2>Why it matters</h2><p>Brought Linux to billions of mobile users.</p>`},
"2011": {t:"Linux 3.0", y:"2011", i:"Kernel 3.0 released, 20th anniversary of Linux.", b:`<h2>What happened</h2><p>Kernel 3.0 released, commemorating 20 years.</p><h2>Why it matters</h2><p>Marked Linux's maturity.</p>`},
"2015": {t:"Linux 4.0", y:"2015", i:"Kernel 4.0 released with live patching.", b:`<h2>What happened</h2><p>Kernel 4.0 introduced live kernel patching.</p><h2>Why it matters</h2><p>Allowed updates without rebooting.</p>`},
"2019": {t:"Linux 5.0", y:"2019", i:"Kernel 5.0 released.", b:`<h2>What happened</h2><p>Kernel 5.0 released with new features and hardware support.</p><h2>Why it matters</h2><p>Continued rapid development.</p>`},
"2022": {t:"Linux 6.0", y:"2022", i:"Linux 6.0 was released in October; initial Rust infrastructure was merged for Linux 6.1 in December.", b:`<h2>What happened</h2><p>Linux 6.0 was released in October 2022. Initial Rust-for-Linux infrastructure was merged for Linux 6.1, released in December 2022; Rust support did not begin with 6.0. <a href="https://www.kernel.org/pub/linux/kernel/v6.x/" target="_blank" rel="noopener noreferrer">Official kernel release archive</a>.</p><h2>Why it matters</h2><p>Rust promises memory safety in kernel code.</p>`},
"2025": {t:"Linux 6.x", y:"2025", i:"The Linux 6.x kernel series continued through 2025; this is a historical milestone, not a claim about the current major series.", b:`<h2>What happened</h2><p>The 6.x series continues with Rust integration and new hardware.</p><h2>Why it matters</h2><p>Linux keeps evolving for modern hardware and safety.</p>`}
};
const id = new URLSearchParams(location.search).get('id') || "1991";
const d = E[id] || E["1991"];
document.title = d.t + " — History of Linux";
document.getElementById('content').innerHTML = `<div class="eyebrow">${d.y}</div><h1>${d.t}</h1><p class="subtitle">${d.i}</p>${d.b}<a class="back" href="index.html">← Back to timeline</a>`;
</script>
</body>
</html>
